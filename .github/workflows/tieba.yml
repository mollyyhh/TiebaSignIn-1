name: Start

on:
  push:
    branches: [main]
  gollum:
  schedule:
    # 北京时间每天 06:17，避开整点拥堵降低延迟概率
    - cron: '17 6 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write         # 保活步骤需要 push，read 不够

concurrency:
  group: tieba-sign-in
  cancel-in-progress: false

jobs:
  TiebaSignIn:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run sign-in
        continue-on-error: true
        env:
          BDUSS: ${{ secrets.BDUSS }}
          SCKEY: ${{ secrets.SCKEY }}
        run: |
          timeout 540 mvn -B compile exec:java \
            -Dexec.mainClass="top.srcrs.Run" \
            -Dexec.args="${BDUSS} ${SCKEY}" || true

      - name: Keep schedule alive
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 不切分支，直接在当前 HEAD 上造空提交
          git commit --allow-empty -m "chore: keep schedule alive $(date -u +%F)"

          # 用 HEAD 而非写死 main，避免 pathspec 报错
          git push origin HEAD
