name: Start

on:
  push:
    branches: [main]      # 只在主分支推送时触发，避免所有分支都跑
  gollum:
  schedule:
    # 北京时间每天 03:00 = UTC 19:00（前一天）
    - cron: '0 19 * * *'
  workflow_dispatch:      # 支持手动立即执行

permissions:
  contents: read          # 最小权限，够 checkout 即可

concurrency:
  group: tieba-sign-in
  cancel-in-progress: false   # 不取消正在跑的，排队执行，避免重复签到

jobs:
  TiebaSignIn:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 防止卡死占满 6 小时

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven     # setup-java 内置 Maven 缓存，替代 actions/cache

      - name: Run sign-in
        env:
          BDUSS: ${{ secrets.BDUSS }}
          SCKEY: ${{ secrets.SCKEY }}
        run: |
          mvn -B compile exec:java \
            -Dexec.mainClass="top.srcrs.Run" \
            -Dexec.args="${BDUSS} ${SCKEY}"
